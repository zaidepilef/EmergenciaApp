  /v1/emergencies/{emergencyId}/activate:
    parameters:
      - $ref: "#/components/parameters/EmergencyIdPath"
    post:
      tags: [emergencies]
      operationId: activateEmergency
      summary: Activar la convocatoria y notificar a todos los brigadistas activos
      description: |
        En **una** transacción corta (sin llamadas de red):

        1. `DRAFT → ACTIVE` (a lo sumo una activa: si hay otra,
           `409 EMERGENCY_ALREADY_ACTIVE`).
        2. Crea un convocado por **cada** brigadista con cuenta activa y perfil
           de brigadista activo. **No** se mira la disponibilidad declarada, la
           última conexión, la versión de la app ni si tiene sesión abierta.
        3. Crea el aviso `ACTIVATION`.
        4. Encola un push por convocado × dispositivo no revocado con token
           válido, **sin filtrar por antigüedad** de `lastSeenAt`. Un
           brigadista con dos teléfonos recibe en ambos: es una entrega por
           dispositivo, no un duplicado. `delivery_once_uq` impide una segunda
           entrega del mismo aviso al mismo dispositivo.

        El push se envía **después** del commit, desde el worker. Si el
        proveedor falla, la convocatoria igual existe en la bandeja de cada
        convocado y llega por sincronización; un brigadista sin dispositivo
        aparece como `NO_DEVICE` en el panel.

        Idempotente por estado: si ya está `ACTIVE`, `200` con el estado
        actual. Si está `CLOSED`, `409 EMERGENCY_CLOSED`.
      x-capabilities: [COORD]
      x-client: [WEB]
      x-idempotency: state
      responses:
        "200":
          description: Activada (o ya estaba activa)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/emergencies/{emergencyId}/notices:
    parameters:
      - $ref: "#/components/parameters/EmergencyIdPath"
    post:
      tags: [emergencies]
      operationId: createEmergencyNotice
      summary: Emitir un aviso de actualización sobre una convocatoria activa
      description: |
        Cambio de punto de encuentro, segundo foco, instrucciones nuevas. En
        una transacción: aplica los cambios opcionales a la convocatoria, crea
        el aviso `UPDATE` y encola el push a **todos** los convocados.

        `id` lo genera el cliente (idempotencia): mismo `id` y contenido →
        `200` con el aviso existente; distinto contenido →
        `409 IDEMPOTENCY_KEY_REUSED`. Solo `ACTIVE`
        (si no, `409 EMERGENCY_NOT_ACTIVE`).
      x-capabilities: [COORD]
      x-client: [WEB]
      x-idempotency: body.id
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoticeCreateRequest" }
      responses:
        "201":
          description: Aviso emitido
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyDetail" }
        "200":
          description: Repetición; el aviso ya existía
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/emergencies/{emergencyId}/close:
    parameters:
      - $ref: "#/components/parameters/EmergencyIdPath"
    post:
      tags: [emergencies]
      operationId: closeEmergency
      summary: Cerrar la convocatoria
      description: |
        `ACTIVE → CLOSED`, aviso `CLOSURE` y push a todos los convocados (sin
        re-aviso). Los re-avisos pendientes de avisos anteriores se cancelan.
        Respuestas tomadas sin conexión **antes** del cierre que lleguen
        después se siguen aceptando (marcadas `lateSyncAfterClose`).

        Idempotente por estado: ya `CLOSED` → `200`. `DRAFT` →
        `409 EMERGENCY_NOT_ACTIVE`.
      x-capabilities: [COORD]
      x-client: [WEB]
      x-idempotency: state
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmergencyCloseRequest" }
      responses:
        "200":
          description: Cerrada (o ya estaba cerrada)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/emergencies/{emergencyId}/recipients:
    parameters:
      - $ref: "#/components/parameters/EmergencyIdPath"
    get:
      tags: [emergencies]
      operationId: listEmergencyRecipients
      summary: Estado por convocado (polling, 10–15 s)
      description: |
        Separa **llegada** (`reach`, por aviso) de **respuesta**
        (`response`). "Recibido" solo se muestra con un acuse del teléfono;
        un éxito del proveedor push es `PROVIDER_ACCEPTED`, nunca "recibido".

        `ETag` / `If-None-Match` como en el resumen: `304` si nada cambió
        (convocatoria, avisos, convocados, respuestas, acuses y entregas).
      x-capabilities: [COORD, ADMIN]
      x-client: [WEB]
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Convocados con su estado
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControlNoCache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [emergencies]
      operationId: addLateRecipient
      summary: Agregar un convocado tarde (cuenta activada después, recién llegado)
      description: |
        Solo `ACTIVE`. Crea el convocado (`LATE_ADDITION`, con autor) y encola
        el push del aviso `ACTIVATION`; el teléfono descarga el resto de los
        avisos por sincronización. El motivo queda en auditoría.

        **Sin notificaciones duplicadas:** el push se encola **solo** si la fila
        de convocado se insertó en esta transacción. Si ya existía (por la
        activación, por otro coordinador o por una reactivación automática),
        no se encola nada nuevo.

        Idempotente por la pareja convocatoria × brigadista: si ya está
        convocado, `200` con su fila. Perfil inactivo →
        `409 BRIGADISTA_INACTIVE`.
      x-capabilities: [COORD]
      x-client: [WEB]
      x-idempotency: natural
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LateRecipientRequest" }
      responses:
        "201":
          description: Convocado agregado
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientStatus" }
        "200":
          description: Ya estaba convocado
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipientStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

