        - name: role
          in: query
          schema: { $ref: "#/components/schemas/AppRole" }
        - name: q
          in: query
          description: Búsqueda por nombre o RUT (prefijo; el RUT se normaliza)
          schema: { type: string, minLength: 1, maxLength: 60 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de cuentas, ordenadas por nombre
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
