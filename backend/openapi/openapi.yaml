  /v1/sync-reviews/{operationId}/resolutions:
    post:
      tags: [reviews]
      operationId: createSyncReviewResolution
      summary: Resolver o anotar una operación en revisión
      description: |
        Evento separado: la operación y la respuesta originales **nunca** se
        modifican. `NOTE` se puede agregar muchas veces; `CONFIRMED` y
        `DISMISSED` son finales (una segunda → `409 ALREADY_RESOLVED`).
        `CORRECTED` queda para cuando se habilite la respuesta en nombre del
        brigadista (fuera del MVP).

        `id` lo genera el cliente (idempotencia, como en los avisos).
      x-capabilities: [COORD]
      x-client: [WEB]
      x-idempotency: body.id
      parameters:
        - $ref: "#/components/parameters/OperationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolutionCreateRequest" }
      responses:
