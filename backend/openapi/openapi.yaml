openapi: 3.1.0
info:
  title: EmergenciaApp API
  version: 1.0.0
  summary: API de convocatorias de emergencia para una brigada (app móvil y dashboard web).
  description: |
    **BORRADOR PARA REVISIÓN — no implementado.** Contrato v1 del MVP, escrito
    antes que el código (D-B5). La guía de revisión está en
    `docs/backend/openapi-v1.md`.

    ## Convenciones

    - Prefijo `/v1`. Un cambio incompatible exige `/v2` o convivencia acordada:
      una app instalada puede pasar semanas sin actualizarse.
    - JSON en UTF-8. Identificadores en inglés; textos visibles los define
      ui-ux-designer a partir de `code`.
    - Fechas ISO 8601 en **UTC con milisegundos** (`2026-11-13T12:00:05.120Z`).
      La zona `America/Santiago` solo se aplica al presentar.
    - Identificadores UUID. Los que genera el cliente (`device.id`,
      `operationId`, `id` de avisos y resoluciones) deben ser UUID v7.
    - `rowVersion` es un entero de la secuencia global de sincronización
      (cabe en un entero seguro de JavaScript).
    - Errores en `application/problem+json` (RFC 9457) con un `code` estable.
    - Paginación por cursor opaco (`cursor`, `limit` ≤ 100); nunca por `offset`.
    - Todas las respuestas llevan `X-Request-Id`.
    - El servidor **es la autoridad**: valida, autoriza y decide el resultado de
      cada operación; ningún cliente decide estados por su cuenta.

    ## Capacidades (evaluadas en el servidor en cada petición)

    | Capacidad | Condición |
    |---|---|
    | `ADMIN` | Rol `ADMINISTRADOR` |
    | `COORD` | Rol `COORDINADOR` |
    | `BRIG` | Perfil de brigadista activo |

    Toda ruta exige usuario activo y sesión `FULL` vigente salvo las marcadas
    con `x-session-scope: ANY` (aceptan también `PASSWORD_CHANGE_ONLY`) o sin
    seguridad (públicas). El rol **nunca** viaja en el token.

    Extensiones usadas por las pruebas de contrato:
    `x-capabilities` (alguna basta), `x-session-scope` (`FULL` o `ANY`),
    `x-client` (`MOBILE`, `WEB`), `x-idempotency`.
  contact:
    name: backend-architect
  license:
    name: Privado
    identifier: LicenseRef-Proprietary

servers:
  - url: /
    description: Mismo origen (el BFF web y la app usan la URL pública configurada)

security:
  - bearerAuth: []

tags:
  - name: health
    description: Salud del proceso (para el contenedor y el proxy)
  - name: auth
    description: Inicio de sesión, renovación, contraseña y cuenta propia
  - name: sync
    description: Sincronización offline-first de la app móvil
  - name: brigadista
    description: Lecturas de respaldo para la app móvil
  - name: dashboard
    description: Preparación de la brigada (coordinador)
  - name: emergencies
    description: Convocatorias, avisos y convocados (coordinador)
  - name: reviews
    description: Operaciones en conflicto o rechazadas (coordinador)
  - name: admin
    description: Usuarios, roles, dispositivos y auditoría (administrador)

paths:
  # ───────────────────────────── Salud ─────────────────────────────
  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: El proceso responde
      security: []
      responses:
        "200":
          description: Vivo
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: El proceso puede atender (la base responde)
      security: []
      responses:
        "200":
          description: Listo
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ───────────────────────────── Autenticación ─────────────────────────────
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión con RUT y contraseña
      description: |
        - El RUT se acepta con o sin puntos y guion; el servidor lo normaliza
          y valida el dígito verificador (`packages/shared/rut`).
        - Cualquier fallo de credenciales (RUT inexistente, contraseña
          incorrecta, provisoria vencida, cuenta inactiva) responde
          `401 INVALID_CREDENTIALS`, con tiempo similar, sin revelar cuál.
        - Con contraseña provisoria la sesión nace `PASSWORD_CHANGE_ONLY`.
        - **Móvil** (`clientType: MOBILE`) registra o actualiza el dispositivo.
          Si `device.id` pertenece a otro usuario → `409 DEVICE_ID_CONFLICT`;
          si fue revocado → `403 DEVICE_REVOKED`. En ambos casos la app genera
          un `device.id` nuevo y reintenta.
        - Vida del token de renovación: 30 días móvil, 12 h web (D-B2).
        - Límites: 10 / 15 min por IP y 5 / 15 min por RUT.
      security: []
      x-client: [MOBILE, WEB]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Sesión creada
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renovar tokens (rotación del token de renovación)
      description: |
        Cada uso entrega un token de renovación **nuevo**; el anterior queda
        reemplazado.

        - Presentar un token ya reemplazado fuera de la ventana de gracia
          revoca **toda la familia** de sesiones (`REUSE_DETECTED`) y responde
          `401`.
        - Dentro de los **10 s** posteriores a una rotación (la app perdió la
          respuesta por un corte de red), presentar el token anterior responde
          `409 REFRESH_RACE` sin revocar: la app reintenta con el token más
          nuevo que tenga o vuelve al login.
        - Usuario inactivo, contraseña restablecida o sesión revocada → `401`.
      security: []
      x-client: [MOBILE, WEB]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Tokens renovados
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar la sesión actual
      description: |
        Revoca la sesión (`LOGOUT`). En móvil además **borra el token push** de
        ese dispositivo: un teléfono sin sesión deja de sonar. El brigadista
        sigue convocado (bandeja interna) y el panel lo muestra como
        `NO_DEVICE`. Idempotente: una sesión ya revocada también responde `204`.
      x-session-scope: ANY
      x-client: [MOBILE, WEB]
      responses:
        "204":
          description: Sesión cerrada
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Cambiar la contraseña propia
      description: |
        Obligatorio con contraseña provisoria. En una transacción: nuevo hash,
        fin de la provisoria, `credential_version + 1`, revocación de **todas**
        las sesiones del usuario (incluida la actual) y emisión de una sesión
        `FULL` nueva para el mismo cliente y dispositivo.

        Reglas: 10–128 caracteres, distinta de la actual, sin contener el RUT.
        Límite: 5 / 15 min por usuario.
      x-session-scope: ANY
      x-client: [MOBILE, WEB]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Contraseña cambiada; sesión FULL nueva
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuario actual, capacidades y estado de la sesión
      x-session-scope: ANY
      x-client: [MOBILE, WEB]
      responses:
        "200":
          description: Usuario actual
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me/devices:
    get:
      tags: [auth]
      operationId: listMyDevices
      summary: Mis dispositivos
      x-client: [MOBILE, WEB]
      responses:
        "200":
          description: Dispositivos del usuario, incluidos los revocados
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/me/devices/{deviceId}/revoke:
    post:
      tags: [auth]
      operationId: revokeMyDevice
      summary: Revocar uno de mis dispositivos (teléfono perdido)
      description: |
        Revoca el dispositivo y sus sesiones (`DEVICE_REVOKED`), borra su
        token push y deja de enviarle push. Idempotente. Un dispositivo ajeno
        responde `404`.
      x-client: [MOBILE, WEB]
      x-idempotency: state
      parameters:
        - $ref: "#/components/parameters/DeviceIdPath"
      responses:
        "200":
          description: Dispositivo revocado
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ───────────────────────────── Sincronización ─────────────────────────────
  /v1/sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      summary: Enviar operaciones creadas en el teléfono (con o sin conexión)
      description: |
        Exige sesión **móvil**; el dispositivo sale de la sesión, nunca del
        cuerpo. El usuario no necesita ser brigadista activo para enviar
        (si no lo es, sus operaciones se rechazan con su motivo).

        **Garantías**

        1. **Idempotencia:** cada operación se identifica por `operationId`
           (= id de la fila que crea). Reenviarla devuelve el resultado
           guardado con `duplicate: true` y no escribe nada. Reintentar un lote
           completo tras un error de red o `5xx` es siempre seguro.
        2. **Aislamiento:** cada operación se procesa en su propia transacción,
           en orden de `deviceSeq`; una inválida no arrastra a las demás.
        3. **Autoridad del servidor:** el servidor valida, autoriza y decide
           `APPLIED` / `SUPERSEDED` / `CONFLICT` / `REJECTED`. El teléfono
           adopta el estado que luego descarga con `/v1/sync/pull`.
        4. **Tiempo sin depender solo del reloj del teléfono:** el orden dentro
           de un teléfono lo da `deviceSeq`; entre fuentes, `estimatedAt`
           calculado por el servidor con el reloj monotónico, el desfase
           medido con `clock` o, en último caso, la hora de recepción. Nada
           queda en el futuro respecto de la recepción. Ventana de ambigüedad:
           60 s → `CONFLICT` para revisión del coordinador.
        5. **Duplicados concurrentes:** si el mismo lote llega dos veces a la
           vez (reintento mientras el primero sigue en curso), la segunda
           transacción espera el candado de versión, encuentra la operación ya
           guardada y responde `duplicate: true`. Un `operationId` repetido con
           otro contenido devuelve el resultado **guardado** (el primero manda)
           y se registra en auditoría.
        6. **Nada se pierde en silencio:** toda operación queda registrada en
           `sync_operation`, también las rechazadas, y el resultado dice el
           motivo. Solo dos casos no pueden tener fila y van a auditoría
           (deduplicada por `operationId`, sin el payload): un tipo que el
           modelo no conoce (`UNSUPPORTED_OPERATION`; al reenviarlo se vuelve a
           evaluar, con `duplicate: false`) y un `operationId` que ya existe
           para **otro** usuario (`INVALID_PAYLOAD`). En ambos el teléfono
           conserva la operación y su payload.
        7. **Ninguna operación queda terminal por un error de numeración:** si
           un `deviceSeq` del lote ya pertenece a otra operación de este
           dispositivo (base local recreada con el mismo `device.id`), el
           servidor responde `409 DEVICE_SEQ_CONFLICT` **sin procesar nada**.
           La app no marca nada como rechazado: genera un `device.id` nuevo,
           inicia sesión de nuevo con él y reenvía **las mismas** operaciones
           (mismos `operationId` y `deviceSeq`).

        **Datos sensibles:** el token push de `REGISTER_PUSH_TOKEN` no se guarda
        en el registro de operaciones (solo su hash); vive únicamente en el
        dispositivo del servidor.

        **Validación:** el sobre del lote (`clock`, lista, `operationId`,
        `deviceSeq`) se valida entero → `400`. El resto de cada operación se
        valida **por separado**: si no cumple su esquema, esa operación sale
        `REJECTED INVALID_PAYLOAD` y las demás siguen.

        **Límites:** 1–50 operaciones, cuerpo ≤ 256 KiB (`413`: la app parte
        el lote). Respuesta `200` aunque haya rechazos.

        **Errores del lote:** `401` (renovar o volver al login),
        `403 DEVICE_REVOKED` (cerrar sesión local), `409 DEVICE_SEQ_CONFLICT`
        (garantía 7), `403 MOBILE_SESSION_REQUIRED`,
        `403 PASSWORD_CHANGE_REQUIRED`, `429`, `5xx` (reintentar con espera
        progresiva). Una cuenta desactivada recibe `200` con cada operación
        `REJECTED ACCOUNT_INACTIVE`, para que la app muestre el motivo.
      x-client: [MOBILE]
      x-idempotency: operationId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Un resultado por operación, en el mismo orden
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/sync/pull:
    post:
      tags: [sync]
      operationId: syncPull
      summary: Descargar cambios desde los cursores del teléfono
      description: |
        Sin efectos salvo `device.last_seen_at`. Exige sesión móvil.

        1. Toda la descarga es **una** instantánea coherente
           (`REPEATABLE READ READ ONLY`).
        2. Por ámbito: filas con `rowVersion > cursor`, en orden, hasta
           `limit`. El cursor nuevo es la versión de la última fila devuelta.
           Entrega "al menos una vez": la app aplica cada fila con upsert por
           `id` **solo si** su `rowVersion` es mayor que la local, y guarda el
           cursor en la misma transacción SQLite que las filas.
        3. Si `syncEpoch` es nulo o distinto del vigente (restauración de un
           backup): `epochChanged: true`, se ignoran los cursores y se descarga
           desde 0. La app debe además **reenviar** por `/v1/sync/push` sus
           operaciones de los últimos 7 días (idempotente).
        4. **Integridad referencial de la respuesta:** toda convocatoria
           referida por una fila de `recipients` o de `notices` de esta
           respuesta que **no** esté en `emergencies.rows` de esta misma
           respuesta va completa, con sus avisos, en `lateAdditions`, sin
           importar su versión (convocado agregado tarde, o ámbito
           `emergencies` paginado). Repetirla es inofensivo (upsert). La app
           aplica en orden padre → hijo (`emergencies`, `lateAdditions`,
           `notices`, `recipients`, `responses`) en una sola transacción.
        5. Si algún ámbito trae `hasMore: true`, la app repite la llamada con
           los cursores nuevos.

        El teléfono solo recibe datos **propios**: nunca de otros brigadistas
        ni el RUT.
      x-client: [MOBILE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPullRequest" }
      responses:
        "200":
          description: Cambios por ámbito
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ───────────────────────────── Brigadista ─────────────────────────────
  /v1/me/active-emergency:
    get:
      tags: [brigadista]
      operationId: getMyActiveEmergency
      summary: Convocatoria activa en la que estoy convocado (respaldo del push)
      description: |
        La app la consulta siempre al abrirse y al recuperar conexión, aunque no
        haya llegado ningún push. `204` si no hay convocatoria activa o si el
        usuario no figura en ella. No reemplaza a `/v1/sync/pull`: es la vía
        rápida para mostrar la convocatoria antes de terminar la descarga.
      x-capabilities: [BRIG]
      x-client: [MOBILE]
      responses:
        "200":
          description: Convocatoria activa, sus avisos y mi fila de convocado
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyActiveEmergency" }
        "204":
          description: Sin convocatoria activa para este usuario
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ───────────────────────────── Dashboard ─────────────────────────────
  /v1/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      summary: Preparación de la brigada y convocatoria activa
      description: |
        La preparación es **informativa**: nunca cambia quién es convocado.
        Toda convocatoria incluye a todos los brigadistas activos.
      x-capabilities: [COORD, ADMIN]
      x-client: [WEB]
      responses:
        "200":
          description: Resumen
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/brigadistas:
    get:
      tags: [dashboard]
      operationId: listBrigadistas
      summary: Brigadistas con su preparación (dispositivos, push, última conexión)
      x-capabilities: [COORD, ADMIN]
      x-client: [WEB]
      parameters:
        - name: active
          in: query
          description: Filtra por perfil de brigadista activo. Por omisión, solo activos.
          schema: { type: boolean, default: true }
        - name: readiness
          in: query
          schema: { $ref: "#/components/schemas/ReadinessState" }
        - name: q
          in: query
          description: Búsqueda por nombre (prefijo, sin distinguir mayúsculas ni tildes)
          schema: { type: string, minLength: 1, maxLength: 60 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de brigadistas, ordenados por nombre
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrigadistaPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ───────────────────────────── Convocatorias ─────────────────────────────
  /v1/emergencies:
    get:
      tags: [emergencies]
      operationId: listEmergencies
      summary: Historial de convocatorias (más recientes primero)
      x-capabilities: [COORD, ADMIN]
      x-client: [WEB]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EmergencyStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de convocatorias (sin descartadas)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [emergencies]
      operationId: createEmergency
      summary: Crear un borrador de convocatoria
      description: |
        `id` lo genera el cliente: repetir la petición con el mismo `id` y el
        mismo contenido devuelve `200` con el borrador existente; con otro
