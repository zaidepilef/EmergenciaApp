name: brigada-emergencias

services:
  # PostgreSQL 18 para desarrollo y pruebas LOCALES del backend
  # (ver backend/README.md). Credenciales solo de desarrollo: nunca en producción.
  # El script de init crea además las bases emergencia_test y emergencia_shadow.
  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emergencia_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-emergencia_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos bajo /var/lib/postgresql/18.
      - postgres_data:/var/lib/postgresql
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 (H-1): al inicializar el volumen, el servidor temporal solo
      # escucha por socket; por TCP no responde hasta que terminó el init, así que
      # "healthy" implica que emergencia_test y emergencia_shadow ya existen.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # pgAdmin para ver y administrar la base LOCAL: http://localhost:5050
  # Modo escritorio (sin login de pgAdmin) y solo en 127.0.0.1: nunca en producción.
  # Arranca con: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: dev_only_local_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin-init/servers.json
    # libpq ignora un pgpass con permisos abiertos (los montajes desde Windows lo son):
    # se copia a /tmp con permisos 600 antes de arrancar.
    entrypoint: ["/bin/sh", "-c", "cp /pgadmin-init/pgpass /tmp/pgpass && chmod 600 /tmp/pgpass && exec /entrypoint.sh"]
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./backend/docker/pgadmin:/pgadmin-init:ro
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
